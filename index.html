<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario Voti</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: rgba(255,255,255,0.9);
      --text: #18212f;
      --muted: #667085;
      --border: #dbe4f0;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warning-soft: #fef3c7;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(135deg, #eef3f9 0%, #ffffff 45%, #eaf4ff 100%);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: var(--shadow);
      border-radius: 32px;
      padding: 28px;
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 24px;
      backdrop-filter: blur(10px);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: 40px;
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      max-width: 700px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      align-self: end;
    }

    .stat {
      border-radius: 24px;
      padding: 18px;
      color: white;
      box-shadow: var(--shadow);
    }

    .stat small {
      opacity: .85;
      display: block;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .stat strong {
      font-size: 34px;
      line-height: 1;
    }

    .stat.dark { background: #0f172a; }
    .stat.green { background: #22c55e; }
    .stat.blue { background: #38bdf8; }

    .layout {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #475467;
      margin-bottom: 8px;
    }

    select, input, button {
      font: inherit;
    }

    select, input {
      width: 100%;
      height: 48px;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 0 14px;
      background: white;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row input { flex: 1; }

    button {
      border: none;
      border-radius: 16px;
      height: 48px;
      padding: 0 18px;
      cursor: pointer;
      transition: .2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { filter: brightness(.95); }

    .btn-outline {
      background: white;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover { background: #f8fafc; }

    .btn-primary:disabled,
    .btn-outline:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .people-list {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .person-chip {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .person-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .stack { display: grid; gap: 24px; }

    .completed-box {
      background: linear-gradient(135deg, #ecfdf3, white);
    }

    .completed-list {
      display: grid;
      gap: 12px;
    }

    .completed-item {
      border: 1px solid #bbf7d0;
      background: white;
      border-radius: 20px;
      padding: 16px;
    }

    .completed-item small {
      color: var(--success);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .completed-item strong {
      display: block;
      margin-top: 6px;
      font-size: 16px;
      text-transform: capitalize;
    }

    .empty-state {
      border: 1px dashed #cbd5e1;
      border-radius: 20px;
      background: white;
      padding: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .alert {
      margin-bottom: 18px;
      background: var(--warning-soft);
      color: #92400e;
      border: 1px solid #fcd34d;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 14px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .day-card {
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 18px;
      background: white;
      transition: .2s ease;
    }

    .day-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
    }

    .day-card.voted {
      background: linear-gradient(135deg, #eff6ff, white);
      border-color: #bfdbfe;
    }

    .day-card.complete {
      background: linear-gradient(135deg, #ecfdf3, white);
      border-color: #bbf7d0;
    }

    .day-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
      margin-bottom: 16px;
    }

    .week-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #64748b;
    }

    .day-title {
      margin-top: 6px;
      font-size: 19px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .status {
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status.todo { background: #f1f5f9; color: #475569; }
    .status.voted { background: #dbeafe; color: #1d4ed8; }
    .status.complete { background: #dcfce7; color: #15803d; }

    .progress-head {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #475467;
      margin-bottom: 8px;
    }

    .progress {
      height: 10px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: #0f172a;
      border-radius: inherit;
    }

    .voters-box {
      margin-top: 14px;
      background: #f8fafc;
      border-radius: 18px;
      padding: 14px;
      font-size: 14px;
      color: #475467;
      min-height: 74px;
      line-height: 1.5;
    }

    .day-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .muted { color: var(--muted); }

    @media (max-width: 1024px) {
      .hero, .layout { grid-template-columns: 1fr; }
      .calendar-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 700px) {
      .container { padding: 16px; }
      h1 { font-size: 30px; }
      .stats { grid-template-columns: 1fr; }
      .calendar-grid { grid-template-columns: 1fr; }
      .row, .day-actions { grid-template-columns: 1fr; display: grid; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="layout">
      <div class="stack">
        <section class="card">
          <h2>Chi sta votando</h2>
          <div>
            <label for="personSelect">Seleziona il tuo nome</label>
            <select id="personSelect"></select>
          </div>
          
<div style="margin-top:16px; display:none;">
  <label for="newPerson">Aggiungi persona</label>
  <div class="row">
    <input id="newPerson" type="text" placeholder="Nome persona" />
    <button class="btn-primary" id="addPersonBtn">Aggiungi</button>
  </div>
</div>
        </div>
          <div class="people-list" id="peopleChips"></div>
          <div class="row" style="margin-top:16px;">
            <!--button class="btn-outline" id="resetBtn">Azzera</button-->
            <button class="btn-outline" id="exportBtn">Esporta JSON</button>
          </div>
        </section>

        <section class="card completed-box">
          <h2>Giorni completati</h2>
          <div id="completedList" class="completed-list"></div>
        </section>
      </div>

      <section class="card">
        <h2>Calendario delle prossime 2 settimane</h2>
        <div class="alert" id="selectAlert">Seleziona una persona per iniziare a votare.</div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "simple-week-vote-app-html";
    const DEFAULT_PEOPLE = ["Cocco", "Giulio", "Mirko", "Andre", "Nihooolass", "Anci"];

    function formatDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatDateLabel(date) {
      return new Intl.DateTimeFormat("it-IT", {
        weekday: "long",
        day: "numeric",
        month: "short"
      }).format(date);
    }

    function startOfWeek(date) {
      const copy = new Date(date);
      const day = copy.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      copy.setDate(copy.getDate() + diff);
      copy.setHours(0, 0, 0, 0);
      return copy;
    }

    function build14Days() {
      const start = startOfWeek(new Date());
      return Array.from({ length: 14 }, (_, i) => {
        const current = new Date(start);
        current.setDate(start.getDate() + i);
        return {
          key: formatDateKey(current),
          label: formatDateLabel(current),
          weekLabel: i < 7 ? "Questa settimana" : "Prossima settimana"
        };
      });
    }

    const days = build14Days();
    let state = loadState();

    const els = {
      personSelect: document.getElementById("personSelect"),
      newPerson: document.getElementById("newPerson"),
      addPersonBtn: document.getElementById("addPersonBtn"),
      peopleChips: document.getElementById("peopleChips"),
      resetBtn: document.getElementById("resetBtn"),
      exportBtn: document.getElementById("exportBtn"),
      completedList: document.getElementById("completedList"),
      calendarGrid: document.getElementById("calendarGrid"),
      selectAlert: document.getElementById("selectAlert"),
      peopleCount: document.getElementById("peopleCount"),
      completeCount: document.getElementById("completeCount"),
      completionRate: document.getElementById("completionRate")
    };

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { selectedPerson: "", people: [...DEFAULT_PEOPLE], votes: {} };
      try {
        const parsed = JSON.parse(raw);
        return {
          selectedPerson: parsed.selectedPerson || "",
          people: Array.isArray(parsed.people) && parsed.people.length ? parsed.people : [...DEFAULT_PEOPLE],
          votes: parsed.votes && typeof parsed.votes === "object" ? parsed.votes : {}
        };
      } catch {
        return { selectedPerson: "", people: [...DEFAULT_PEOPLE], votes: {} };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state, null, 2));
    }

    function getCompletedDays() {
      return days.filter(day => {
        const voters = state.votes[day.key] || [];
        return state.people.length > 0 && voters.length === state.people.length;
      });
    }

    function getCompletionRate() {
      const totalPossible = days.length * state.people.length;
      const totalActual = Object.values(state.votes).reduce((sum, arr) => sum + arr.length, 0);
      if (!totalPossible) return 0;
      return Math.round((totalActual / totalPossible) * 100);
    }

    function setSelectedPerson(name) {
      state.selectedPerson = name;
      saveState();
      render();
    }

    function addPerson() {
      const name = els.newPerson.value.trim();
      if (!name) return;
      if (state.people.some(p => p.toLowerCase() === name.toLowerCase())) {
        els.newPerson.value = "";
        return;
      }
      state.people.push(name);
      if (!state.selectedPerson) state.selectedPerson = name;
      els.newPerson.value = "";
      saveState();
      render();
    }

    function vote(dayKey) {
      if (!state.selectedPerson) return;
      const current = state.votes[dayKey] || [];
      if (current.includes(state.selectedPerson)) return;
      state.votes[dayKey] = [...current, state.selectedPerson];
      saveState();
      render();
    }

    function removeVote(dayKey) {
      if (!state.selectedPerson) return;
      const current = state.votes[dayKey] || [];
      state.votes[dayKey] = current.filter(name => name !== state.selectedPerson);
      saveState();
      render();
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "voti-calendario.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function resetVotes() {
      state.votes = {};
      saveState();
      render();
    }

    function renderPeople() {
      els.personSelect.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Scegli una persona";
      els.personSelect.appendChild(placeholder);

      state.people.forEach(person => {
        const option = document.createElement("option");
        option.value = person;
        option.textContent = person;
        option.selected = state.selectedPerson === person;
        els.personSelect.appendChild(option);
      });

      els.peopleChips.innerHTML = "";
      state.people.forEach(person => {
        const chip = document.createElement("button");
        chip.className = `person-chip ${state.selectedPerson === person ? "active" : ""}`;
        chip.textContent = person;
        chip.onclick = () => setSelectedPerson(person);
        els.peopleChips.appendChild(chip);
      });
    }

    function renderCompletedDays() {
      const completed = getCompletedDays();
      els.completedList.innerHTML = "";
      if (!completed.length) {
        els.completedList.innerHTML = '<div class="empty-state">Nessun giorno è ancora completo.</div>';
        return;
      }
      completed.forEach(day => {
        const item = document.createElement("div");
        item.className = "completed-item";
        item.innerHTML = `
          <small>Completato</small>
          <strong>${day.label}</strong>
          <div class="muted" style="margin-top:8px; font-size:14px;">${state.people.length}/${state.people.length} persone hanno votato</div>
        `;
        els.completedList.appendChild(item);
      });
    }

    function renderCalendar() {
      els.calendarGrid.innerHTML = "";
      els.selectAlert.style.display = state.selectedPerson ? "none" : "block";
      days.forEach(day => {
        const voters = state.votes[day.key] || [];
        const hasVoted = state.selectedPerson ? voters.includes(state.selectedPerson) : false;
        const isComplete = state.people.length > 0 && voters.length === state.people.length;
        const progress = state.people.length ? Math.min((voters.length / state.people.length) * 100, 100) : 0;

        const card = document.createElement("div");
        card.className = `day-card ${isComplete ? "complete" : hasVoted ? "voted" : ""}`;
        const statusClass = isComplete ? "complete" : hasVoted ? "voted" : "todo";
        const statusText = isComplete ? "Completo" : hasVoted ? "Votato" : "Da votare";

        card.innerHTML = `
          <div class="day-top">
            <div>
              <div class="week-label">${day.weekLabel}</div>
              <div class="day-title">${day.label}</div>
            </div>
            <div class="status ${statusClass}">${statusText}</div>
          </div>

          <div class="progress-head">
            <span>Avanzamento</span>
            <strong>${voters.length}/${state.people.length}</strong>
          </div>
          <div class="progress">
            <div class="progress-bar" style="width:${progress}%"></div>
          </div>

          <div class="voters-box">
            <strong>Hanno votato:</strong><br>
            ${voters.length ? voters.join(", ") : "nessuno"}
          </div>

          <div class="day-actions">
            <button class="btn-primary vote-btn" ${!state.selectedPerson || hasVoted ? "disabled" : ""}>
              ${hasVoted ? "Già votato" : "Vota"}
            </button>
            <button class="btn-outline remove-btn" ${!state.selectedPerson || !hasVoted ? "disabled" : ""}>
              Rimuovi
            </button>
          </div>
        `;

        card.querySelector(".vote-btn").onclick = () => vote(day.key);
        card.querySelector(".remove-btn").onclick = () => removeVote(day.key);
        els.calendarGrid.appendChild(card);
      });
    }

    function renderStats() {
      els.peopleCount.textContent = state.people.length;
      els.completeCount.textContent = getCompletedDays().length;
      els.completionRate.textContent = `${getCompletionRate()}%`;
    }

    function render() {
      renderPeople();
      renderCompletedDays();
      renderCalendar();
      renderStats();
    }

    els.personSelect.addEventListener("change", e => setSelectedPerson(e.target.value));
    els.addPersonBtn.addEventListener("click", addPerson);
    els.newPerson.addEventListener("keydown", e => {
      if (e.key === "Enter") addPerson();
    });
    els.resetBtn.addEventListener("click", resetVotes);
    els.exportBtn.addEventListener("click", exportJson);

    render();
  </script>
</body>
</html>
